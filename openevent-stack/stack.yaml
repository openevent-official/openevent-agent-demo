# Deployment template. Set the model provider, API key, model and Chat web token before --apply.
version: chat-runtime.v1
runtime:
  name: openevent-stack
  supervisor:
    ctl: ./process.sh
    programs:
      openevent: openevent
      model_proxy: model-proxy
      cmd_worker: cmd-worker
      chat_server: chat-server
      agent: chat-model-agent
      view: openevent-view
openevent:
  grpc_addr: 127.0.0.1:9527
  admin_addr: 127.0.0.1:9528
  storage:
    path: runtime/data/openevent
view:
  port: 9999
principals:
  user: 10001
  agent: 10002
  model_proxy: 20001
  cmd_worker: 30001
# OpenEvent access tokens and auxiliary Channels are resolved automatically during --apply.
tokens: {}
model:
  response_header_ms: 300000
  idle_ms: 300000
  provider_name: default
  base_url: https://api.example.com
  api_key: replace-with-model-key
  model: example-model
cmd:
  max_concurrent_tasks: 4
  default_timeout_ms: 300000
agent:
  model_timeout_ms: 300000
  system_prompt_file: ./prompts/system.txt
  context_compression_prompt_file: ./prompts/context_compression.txt
  context_max_input_bytes: 1048576
  # Delay between model attempts, in milliseconds.
  model_retry_interval_ms: 1000
  cmd_result_timeout_ms: 330000
chat:
  host: 0.0.0.0
  port: 8081
  max_user_message_bytes: 65536
  web_token: replace-with-web-token
